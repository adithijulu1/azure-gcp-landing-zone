trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

stages:
  - stage: Validate
    jobs:
      - job: TerraformValidate
        steps:
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: '1.6.0'
          - script: |
              cd terraform/azure
              terraform init -backend=false
              terraform validate
            displayName: 'Terraform Validate'

  - stage: Plan
    dependsOn: Validate
    jobs:
      - job: TerraformPlan
        steps:
          - script: |
              cd terraform/azure
              terraform init
              terraform plan -out=tfplan
            displayName: 'Terraform Plan'

  - stage: Deploy
    dependsOn: Plan
    condition: succeeded()
    jobs:
      - job: TerraformApply
        steps:
          - script: |
              cd terraform/azure
              terraform apply -auto-approve tfplan
            displayName: 'Terraform Apply'
